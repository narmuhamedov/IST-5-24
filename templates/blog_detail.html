{% load static %}
{% include 'layouts/header.html' %}
<link rel="stylesheet" href="{% static 'css/detail.css' %}">
<main class="blog-detail">
    <article class="blog-card">

        <h1 class="blog-detail-title">{{ blog_id.title }}</h1>
        
        {% if blog_id.created_at %}
            <p class="blog-detail-date">📅 {{ blog_id.created_at }}</p>
        {% else %}
            <p class="blog-detail-date">📅 Дата загрузки неизвестна</p>
        {% endif %}

        <div class="blog-detail-image">
            <img src="{{ blog_id.image.url }}" alt="{{ blog_id.title }}" width="300" height="200">
        </div>

        <p class="blog-detail-text">{{ blog_id.description }}</p>

        <a href="/" class="blog-back-btn">← Назад к списку</a>

    </article>
</main>


{% include 'layouts/footer.html' %}
