{% load static %}
{% include 'layouts/header.html' %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<main class="blog-section">
    <h1 class="blog-heading">Наш блог</h1>
      <form method="GET" action="{% url 'search' %}" class="blog-search-form">
        <input 
            type="text" 
            name="q" 
            class="blog-search-input" 
            placeholder="Поиск по блогу..." 
        >
        <button type="submit" class="blog-search-btn">Найти</button>
    </form>
    <ul class="blog-list">
        {% for i in blog %}
        <li class="blog-item">
            <h2 class="blog-title">{{ i.title }}</h2>
            {% if i.created_at %}
            <p class="blog-date">{{ i.created_at }}</p>
            {% else %}
             <p class="blog-date">Дата загрузки неизвестна</p>
            {% endif %}
            <a href="/blog_list/{{ i.id }}/" class="blog-btn">Подробнее</a>
        </li>
        {% endfor %}
    </ul>
</main>
{% include 'layouts/footer.html' %}
